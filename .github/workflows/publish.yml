name: Agentic publisher

# Runs hourly; the orchestrator decides whether a post is due right now based on
# the ramp schedule in site.config.json (1 → 2 → 3 → 5 → 6 → 7 posts/day, then
# random 0–6). Most runs exit in seconds without calling any API.
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Publish this many posts now, ignoring the schedule (blank = follow schedule)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run agents
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AHREFS_API_KEY: ${{ secrets.AHREFS_API_KEY }}
          AMAZON_TAG: ${{ vars.AMAZON_TAG }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          AMAZON_CREATORS_CREDENTIAL_ID: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_ID }}
          AMAZON_CREATORS_CREDENTIAL_SECRET: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_SECRET }}
          AMAZON_CREATORS_VERSION: ${{ vars.AMAZON_CREATORS_VERSION }}
        run: |
          if [ -n "${{ github.event.inputs.force }}" ]; then
            node agents/orchestrator.mjs --force "${{ github.event.inputs.force }}"
          else
            node agents/orchestrator.mjs
          fi

      - name: Featured images, validate and build
        env:
          AMAZON_TAG: ${{ vars.AMAZON_TAG }}
        run: |
          npm run images
          npm run check:content
          npm run build

      - name: Commit and push
        id: commit
        run: |
          if [ -z "$(git status --porcelain)" ]; then echo "Nothing new to publish."; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git config user.name "best-safe-agents"
          git config user.email "agents@users.noreply.github.com"
          git add src/content data public/images
          git commit -m "content: agentic publish $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: publish
    if: needs.publish.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
